# GLPI 11.0.11 (new login page) using your EXISTING database.
# No database container is created; GLPI connects to the database
# configured in your existing config/config_db.php.

services:
  glpi:
    build: .
    image: glpi-custom:11.0.11
    container_name: glpi
    restart: unless-stopped
    ports:
      - "${GLPI_PORT:-8080}:80"
    extra_hosts:
      # lets the container reach a database running on this server
      - "host.docker.internal:host-gateway"
    volumes:
      - ${GLPI_CONFIG_DIR}:/var/www/glpi/config
      - ${GLPI_FILES_DIR}:/var/www/glpi/files
      - ${GLPI_MARKETPLACE_DIR}:/var/www/glpi/marketplace

  # Runs GLPI automatic actions (notifications, cleanup...) every minute
  glpi-cron:
    image: glpi-custom:11.0.11
    container_name: glpi-cron
    restart: unless-stopped
    depends_on:
      - glpi
    user: www-data
    entrypoint: ["sh", "-c", "while true; do php /var/www/glpi/front/cron.php; sleep 60; done"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${GLPI_CONFIG_DIR}:/var/www/glpi/config
      - ${GLPI_FILES_DIR}:/var/www/glpi/files
      - ${GLPI_MARKETPLACE_DIR}:/var/www/glpi/marketplace
