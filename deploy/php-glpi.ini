; Settings GLPI checks for, plus room for imports and attachments.
memory_limit = 512M
max_execution_time = 600
upload_max_filesize = 64M
post_max_size = 64M
date.timezone = ${TZ}

session.cookie_httponly = On
session.cookie_samesite = Lax
expose_php = Off

; GLPI's checks of its online services (marketplace, GLPI Network) wait this long for an answer. The PHP default
; is 60 s, as long as most reverse proxies wait, so on a server without internet access the proxy gave up first.
default_socket_timeout = 10

opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
